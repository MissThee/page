<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="cache-control" content="max-age=86400">
    <link rel="icon" href="favicon.ico">
    <title>Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            height: 100%;
            width: 100%;
        }


        /* 滚动条整体宽度 */
        ::-webkit-scrollbar {
            width: 8px !important;
            height: 8px !important;;
        }

        /* 滚动条滑槽样式*/
        ::-webkit-scrollbar-track {
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        /*滚动条样式*/
        ::-webkit-scrollbar-thumb {
            border-radius: 8px;
            background: #bbb;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }

        ::-webkit-scrollbar-thumb:active {
            background: #bbb;
        }

        /* 浏览器失焦的样式*/
        ::-webkit-scrollbar-thumb:window-inactive {
            background: #ccc;
        }
    </style>
</head>
<body>
<div id="rootEl" style="border:1px solid black;display: inline-block"></div>

<script>

    const width = 450
    const height = 312

    const buildNode = (circle) => ({circleGraph: circle, next: null, previous: null})

    function bounds(circles, pad = 0) {
        const x0 = circles.reduce((v, {x, r}) => Math.min(v, x - r - pad), +Infinity);
        const x1 = circles.reduce((v, {x, r}) => Math.max(v, x + r + pad), -Infinity);
        const y0 = circles.reduce((v, {y, r}) => Math.min(v, y - r - pad), +Infinity);
        const y1 = circles.reduce((v, {y, r}) => Math.max(v, y + r + pad), -Infinity);
        return [x0, y0, x1 - x0, y1 - y0];
    }

    function scoreRectangle(node) {
        const a = node.circleGraph;
        const b = node.next.circleGraph;
        const ab = a.r + b.r;
        const cx = (a.x * b.r + b.x * a.r) / ab;
        const cy = (a.y * b.r + b.y * a.r) / ab;
        //cx * cx + cy * cy

        return Math.max(Math.abs(cx * height), Math.abs(cy * width));
    }

    const pack = (circles) => {
        const n = circles.length;
        if (n === 0) return circles;

        let a, b, c;

        // Place the first circle.
        a = circles[0];
        a.x = 0;
        a.y = 0;
        if (n <= 1) return circles;

        // Place the second circle.
        b = circles[1];
        b.x = a.r + b.r;
        b.y = 0;
        if (n <= 2) return circles;

        // Place the third circle.
        c = circles[2]
        place(b, a, c);

        // Initialize the front-chain using the first three circles a, b and c.
        a = buildNode(a);
        b = buildNode(b);
        c = buildNode(c);
        a.next = c.previous = b;
        b.next = a.previous = c;
        c.next = b.previous = a;

        // Attempt to place each remaining circle…
        pack: for (let i = 3; i < n; ++i) {
            place(a.circleGraph, b.circleGraph, circles[i]);
            c = buildNode(circles[i]);

            // Find the closest intersecting circle on the front-chain, if any.
            // “Closeness” is determined by linear distance along the front-chain.
            // “Ahead” or “behind” is likewise determined by linear distance.
            let j = b.next, k = a.previous, sj = b.circleGraph.r, sk = a.circleGraph.r;
            do {
                if (sj <= sk) {
                    if (intersects(j.circleGraph, c.circleGraph)) {
                        b = j;
                        a.next = b;
                        b.previous = a;
                        --i;
                        continue pack;
                    }
                    sj += j.circleGraph.r;
                    j = j.next;
                } else {
                    if (intersects(k.circleGraph, c.circleGraph)) {
                        a = k;
                        a.next = b;
                        b.previous = a;
                        --i;
                        continue pack;
                    }
                    sk += k.circleGraph.r;
                    k = k.previous;
                }
            } while (j !== k.next);

            // Success! Insert the new circle c between a and b.
            c.previous = a;
            c.next = b;
            a.next = b.previous = b = c;

            // Compute the new closest circle pair to the centroid.
            let aa = scoreRectangle(a), ca;
            while ((c = c.next) !== b) {
                console.log(c)
                if ((ca = scoreRectangle(c)) < aa) {
                    a = c;
                    aa = ca;
                }
            }
            b = a.next;
        }

        return circles;
    }

    function place(b, a, c) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2) {
            const a2 = (a.r + c.r) ** 2;
            const b2 = (b.r + c.r) ** 2;
            if (a2 > b2) {
                const x = (d2 + b2 - a2) / (2 * d2);
                const y = Math.sqrt(Math.max(0, b2 / d2 - x * x));
                c.x = b.x - x * dx - y * dy;
                c.y = b.y - x * dy + y * dx;
            } else {
                const x = (d2 + a2 - b2) / (2 * d2);
                const y = Math.sqrt(Math.max(0, a2 / d2 - x * x));
                c.x = a.x + x * dx - y * dy;
                c.y = a.y + x * dy + y * dx;
            }
        } else {
            c.x = a.x + c.r;
            c.y = a.y;
        }
    }

    function intersects(a, b) {
        const dr = a.r + b.r - 1e-6;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        return dr > 0 && dr * dr > dx * dx + dy * dy;
    }


    function makeSVG(tag, attrs) {
        const ns = 'http://www.w3.org/2000/svg';
        const xlinkns = 'http://www.w3.org/1999/xlink';

        let el = document.createElementNS(ns, tag);
        if (tag === 'svg') {
            el.setAttribute('xmlns:xlink', xlinkns);
        }
        for (let k in attrs) {
            if (k === 'xlink:href') {
                el.setAttributeNS(xlinkns, k, attrs[k]);
            } else {
                el.setAttribute(k, attrs[k]);
            }
        }
        return el;
    }

    // const arr = Array.from({length: 5}, () => ({r: 50 + Math.random() * 100}))
    const arr=[
        {
            "r": 137.7474750051979,
            "x": 0,
            "y": 0
        },
        {
            "r": 130.6527373417159,
            "x": 268.4002123469138,
            "y": 0
        },
        {
            "r": 120.67932701933863,
            "x": 140.9374432959127,
            "y": 216.61267064010914
        },
        {
            "r": 63.014125327534785,
            "x": 139.4131543442097,
            "y": -144.46173390887103
        },
        {
            "r": 133.119584118663,
            "x": -10.732975783962729,
            "y": -270.6543311111611
        }
    ]
    let circles;
    let minRateDifference = 100;
    for (let i = 0; i <3; i++) {
        let arrTmp
        if(i===0){
            arrTmp=arr.sort((a, b) => a.r < b.r ? 1 : -1)
        }else if(i===1){
            arrTmp=arr.sort((a, b) => a.r > b.r ? 1 : -1)
        }else{
            arrTmp=arr.sort(()=>Math.random() > 0.5 ? 1 : -1)
        }

        let circlesTmp = pack(arrTmp)
        let left = 0
        let right = 0
        let top = 0
        let bottom = 0
        circlesTmp.forEach(e => {
            left = Math.min(e.x - e.r)
            right = Math.max(e.x + e.r)
            bottom = Math.min(e.y - e.r)
            top = Math.max(e.y + e.r)
        })
        const widthTmp = right - left
        const heightTmp = top - bottom
        const currentRateDifference = Math.abs(heightTmp / widthTmp - height / width)
        // console.log(currentRateDifference, minRateDifference)
        if (currentRateDifference < minRateDifference) {
            minRateDifference = currentRateDifference
            circles = circlesTmp
        }
    }


    const svgEl = makeSVG('svg', {viewBox: bounds(circles, 1).join(), width, height})
    const g = makeSVG('g', {fill: 'none', stroke: 'black'})
    svgEl.appendChild(g)
    Object.values(circles).forEach(({x, y, r}, index) => {
        const circle = makeSVG('circle', {cx: x, cy: y, r})
        const text = makeSVG('text', {x, y, 'font-size': '20px'})
        text.append('' + index)
        g.appendChild(circle);
        g.appendChild(text);
    })

    document.getElementById('rootEl').appendChild(svgEl)
</script>

</body>
</html>
